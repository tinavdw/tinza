<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tinza</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
/* GLOBAL SANS FLIP — one rule, whole app. !important overrides every inline Georgia in section JS too. */
* { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif !important; }
body { background: #0f0e0c; font-family: Georgia, serif; color: #f0ebe1; max-width: 600px; margin: 0 auto; }
button { font-family: Georgia, serif; cursor: pointer; }
input[type=range] { width: 100%; accent-color: #c06020; height: 6px; cursor: pointer; }
input[type=text], input[type=search] { -webkit-appearance: none; border-radius: 8px; }
@media (max-width: 400px) { .content { padding: 10px 12px; } .header { padding: 10px 14px; } }
.header { background: #1a1008; border-bottom: 1px solid #6a3010; padding: 14px 20px; }
.back-btn { background: none; border: none; font-size: 13px; cursor: pointer; margin-bottom: 8px; padding: 0; display: block; }
.content { padding: 14px 16px; }
.card { border-radius: 10px; padding: 14px; margin-bottom: 12px; }
.pill-row { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 14px; }
.pill { flex-shrink: 0; padding: 7px 14px; border-radius: 20px; cursor: pointer; font-size: 11px; white-space: nowrap; border: 1px solid; font-family: Georgia, serif; }
.step-num { min-width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; flex-shrink: 0; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.next-btn { width: 100%; padding: 16px; border-radius: 12px; font-size: 15px; font-weight: bold; border: none; cursor: pointer; margin-top: 16px; margin-bottom: 20px; }
.shop-item { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #1e1a10; }
.shop-check { width: 20px; height: 20px; border-radius: 4px; border: 2px solid #c06020; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }

/* ── SERVING ADJUSTER ───────────────────────── */
.serving-adjuster { display:flex; align-items:center; gap:12px; background:#1a1208; border:1px solid #4a3010; border-radius:10px; padding:10px 14px; margin-bottom:12px; }
.serving-btn { width:36px; height:36px; border-radius:50%; border:2px solid #c06020; background:transparent; color:#c06020; font-size:22px; line-height:1; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; }
.serving-display { flex:1; text-align:center; }
.serving-num { font-size:28px; color:#f5c842; font-weight:bold; line-height:1; }
.serving-label { font-size:10px; color:#5a4030; margin-top:2px; }

/* ── PHOTO PLACEHOLDER ──────────────────────── */
.photo-placeholder { background:#1a1208; border:1px dashed #3a2010; border-radius:10px; height:140px; display:flex; flex-direction:column; align-items:center; justify-content:center; margin-bottom:12px; gap:6px; }

/* ── GOES WELL WITH ─────────────────────────── */
.goes-well { background:#1a1a20; border:1px solid #3a3a58; border-radius:10px; padding:12px; margin-bottom:10px; }
.goes-well-pill { display:inline-flex; align-items:center; gap:5px; background:#1a1410; border:1px solid #3a2a18; border-radius:20px; padding:7px 12px; font-size:12px; color:#d0c8b8; margin:3px; cursor:pointer; }

/* ── TIMER BUTTON ───────────────────────────── */
.timer-btn { background:#1a1208; border:1px solid #c06020; color:#c06020; border-radius:6px; padding:5px 10px; font-size:11px; cursor:pointer; font-family:Georgia,serif; margin-top:4px; }

/* ── TIMER BAR ──────────────────────────────── */
.timer-display { font-size:22px; color:#f5c842; font-weight:bold; font-family:Georgia,serif; }
.timer-label { font-size:10px; color:#c06020; }
.timer-cancel { background:transparent; border:1px solid #5a4a30; color:#7a6a50; border-radius:6px; padding:6px 12px; font-size:12px; cursor:pointer; }

/* ── COOKING MODE ───────────────────────────── */
.cook-step { padding:18px 20px; border-bottom:1px solid #1a1a10; cursor:pointer; }
.cook-step.done { opacity:0.35; }
.cook-step-num { font-size:11px; color:#c06020; letter-spacing:1px; text-transform:uppercase; margin-bottom:6px; display:flex; align-items:center; justify-content:space-between; }
.cook-step-text { font-size:19px; color:#f0ebe1; line-height:1.6; }
.cook-timer-inline { background:#1a1208; border:1px solid #c06020; color:#c06020; border-radius:6px; padding:5px 12px; font-size:12px; cursor:pointer; }

/* ── HOW IT WORKS ───────────────────────────── */
.how-it-works { background:#0f1208; border-left:2px solid #c06020; padding:10px 12px; margin-bottom:12px; border-radius:0 6px 6px 0; }
</style>
</head>
<body>
<!-- ── TIMER BAR ──────────────────────────────────────────── -->
<div class="timer-bar" id="globalTimerBar" style="display:none;position:fixed;top:0;left:0;right:0;z-index:200;background:#1a1208;border-bottom:2px solid #c06020;padding:10px 16px;display:none;align-items:center;justify-content:space-between;max-width:600px;margin:0 auto;">
  <div>
    <div class="timer-display" id="timerDisplay">5:00</div>
    <div class="timer-label" id="timerLabel">Timer</div>
  </div>
  <button class="timer-cancel" onclick="cancelTimer()">✕ Cancel</button>
</div>
<!-- ── COOKING MODE OVERLAY ───────────────────────────────── -->
<div class="cooking-mode" id="cookingModeOverlay" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#0a0906;z-index:300;overflow-y:auto;max-width:600px;margin:0 auto;">
  <div style="background:#1a1208;border-bottom:2px solid #c06020;padding:14px 20px;position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;">
    <div>
      <div style="font-size:11px;color:#c06020;letter-spacing:2px;text-transform:uppercase;">Cooking Mode</div>
      <div style="font-size:14px;color:#f5e8cc;" id="cookModeTitle"></div>
    </div>
    <button onclick="closeCookingMode()" style="background:#2a1208;border:1px solid #c06020;color:#c06020;border-radius:8px;padding:8px 16px;font-size:13px;cursor:pointer;">✕ Exit</button>
  </div>
  <div id="cookModeSteps" style="padding-bottom:40px;"></div>
</div>
<div id="root" role="main"></div>

<!-- Load order matters: data → prices → core → utils → search → WK data → spice → sections -->
<script src="sections/data.js"></script>
<script src="sections/prices.js"></script>
<script src="sections/core.js"></script>
<script src="sections/utils.js"></script>
<script src="sections/search.js"></script>
<script src="sections/wk_africa.js"></script>
<script src="sections/wk_europe.js"></script>
<script src="sections/wk_world.js"></script>
<script src="sections/wk_southafrica.js"></script>
<script src="sections/spice.js"></script>
<script src="sections/worldkitchen.js"></script>
<script src="sections/meals.js"></script>
<script src="sections/budget.js"></script>
<script src="sections/braai.js"></script>
<script src="sections/tinyTummies.js"></script>
<script src="sections/furry.js"></script>
<script src="sections/health.js"></script>
<script src="sections/eventsData.js"></script>
<script src="sections/buffet.js"></script>
<script src="sections/kiddies.js"></script>
<script src="sections/events.js"></script>
</body>
</html>
